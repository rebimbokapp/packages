syntax = "proto2";

package notification;

import "common.proto";

service NotificationService {
  rpc CreateNotification (CreateNotificationRequest) returns (CreateNotificationResponse);
  rpc GetNotificationById (GetNotificationByIdRequest) returns (GetNotificationByIdResponse);
  rpc GetAllNotificationsByUserId (GetAllNotificationsByUserIdRequest) returns (GetAllNotificationsByUserIdResponse);
}

message CreateNotificationRequest {
  required string title = 1;
  required string action = 2;
  required string description = 3;
  required string user_id = 4;
}

message CreateNotificationResponse {
  required common.Notification notification = 1;
}

message GetNotificationByIdRequest {
  required string notification_id = 1;
}

message GetNotificationByIdResponse {
  required common.Notification notification = 1;
}

message GetAllNotificationsByUserIdRequest {
  required string user_id = 1;
}

message GetAllNotificationsByUserIdResponse {
  required common.Notification notification = 1;
}